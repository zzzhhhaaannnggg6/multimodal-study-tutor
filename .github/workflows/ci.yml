name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml || -f setup.py || -f setup.cfg ]]; then
            python -m pip install -e ".[dev,pdf,openai]"
          fi
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile

          roots = [Path("src"), Path("tests"), Path("cli")]
          files = [
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*.py")
              if ".venv" not in path.parts
          ]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python file(s).")
          PY

      - name: Run tests when a test runner is configured
        shell: bash
        run: |
          set -euo pipefail
          if find tests -type f -name 'test*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -q
          else
            echo "No Python test files found; syntax checks completed."
          fi

      - name: Reject machine-specific absolute paths
        shell: bash
        run: |
          set -euo pipefail
          # Validation tests may contain synthetic paths as rejection fixtures.
          if rg -n --hidden --glob '!.git/**' --glob '!*.lock' --glob '!tests/**' \
            '/(Users|home)/[[:alnum:]_.-]+(/|$)|[A-Za-z]:[\\/]Users[\\/][[:alnum:]_.-]+([\\/]|$)' .; then
            echo "Found a machine-specific absolute path in tracked content." >&2
            exit 1
          fi

      - name: Check synthetic numerical teaching answers
        run: |
          python -m mst.cli evaluate evals/number-conversion-v1.json --output /tmp/mst-numerical-evaluation.json
          python -m mst.cli evaluate evals/number-notation-v1.json --output /tmp/mst-notation-evaluation.json
          python -m mst.cli evaluate evals/binary-arithmetic-v1.json --output /tmp/mst-binary-evaluation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-evaluation-python-${{ matrix.python-version }}
          path: |
            /tmp/mst-numerical-evaluation.json
            /tmp/mst-notation-evaluation.json
            /tmp/mst-binary-evaluation.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify an installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/mst-wheel-check
          /tmp/mst-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/mst-wheel-check/bin/python "$GITHUB_WORKSPACE/tests/check_installed_web.py"
          /tmp/mst-wheel-check/bin/python -m pip install 'multimodal-study-tutor[pdf]'
          /tmp/mst-wheel-check/bin/python "$GITHUB_WORKSPACE/tests/check_installed_pdf.py"

  web:
    name: Student browser workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e .
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
