name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml || -f setup.py || -f setup.cfg ]]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile

          roots = [Path("src"), Path("tests"), Path("cli")]
          files = [
              path
              for root in roots
              if root.exists()
              for path in root.rglob("*.py")
              if ".venv" not in path.parts
          ]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python file(s).")
          PY

      - name: Run tests when a test runner is configured
        shell: bash
        run: |
          set -euo pipefail
          if find tests -type f -name 'test*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -q
          else
            echo "No Python test files found; syntax checks completed."
          fi

      - name: Reject machine-specific absolute paths
        shell: bash
        run: |
          set -euo pipefail
          # Validation tests may contain synthetic paths as rejection fixtures.
          if rg -n --hidden --glob '!.git/**' --glob '!*.lock' --glob '!tests/**' \
            '/(Users|home)/[[:alnum:]_.-]+(/|$)|[A-Za-z]:[\\/]Users[\\/][[:alnum:]_.-]+([\\/]|$)' .; then
            echo "Found a machine-specific absolute path in tracked content." >&2
            exit 1
          fi
