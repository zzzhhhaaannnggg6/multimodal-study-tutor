[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-study-tutor"
version = "0.2.0"
description = "Reconstruct traceable lessons from slides, readings, and teacher speech."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Multimodal Study Tutor contributors" }]
keywords = ["education", "multimodal", "study", "slides", "transcript", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
study = "mst.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
