[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-study-tutor"
version = "0.2.0"
description = "Reconstruct traceable lessons from slides, readings, and teacher speech."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Multimodal Study Tutor contributors" }]
keywords = ["education", "multimodal", "study", "slides", "transcript", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
pdf = ["pypdf>=4.0"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
study = "mst.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/multimodal-study-tutor/web" = ["web/index.html", "web/app.js", "web/progress.js", "web/styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
